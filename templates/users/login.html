{% extends "base.html" %}

{% block title %}Вход{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">

            <h1 class="mb-4 text-center">Вход</h1>

            <form method="post" class="border rounded p-4 shadow-sm bg-light">
                {% csrf_token %}
                {{ form.non_field_errors }}

                <div class="mb-3">
                    <label for="{{ form.username.id_for_label }}" class="form-label">Email</label>
                    {{ form.username }}
                    {{ form.username.errors }}
                </div>

                <div class="mb-3">
                    <label for="{{ form.password.id_for_label }}" class="form-label">Пароль</label>
                    {{ form.password }}
                    {{ form.password.errors }}
                </div>

                <button type="submit" class="btn btn-primary w-100">Войти</button>
            </form>

            <p class="mt-3 text-center">
                Нет аккаунта?
                <a href="{% url 'users:register' %}">Зарегистрироваться</a>
            </p>

        </div>
    </div>
{% endblock %}
