{% extends "base.html" %}

{% block title %}Удалить пост-Блог{% endblock %}

{% block content %}

<div class="container py-5">
    <h1>Подтверждение удаления</h1>
    
    <p class="lead">Вы уверены, что хотите удалить пост <strong>{{ object.title }}</strong>?</p>
    
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Да, удалить</button>
        <a href="{% url 'blog:detail' object.pk %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>

{% endblock %}
