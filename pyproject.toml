[project]
name = "sky-shop"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django (==4.2)",
    "django-bootstrap5 (>=26.2,<27.0)",  # библа CDN стилей
    "psycopg2-binary (>=2.9.12,<3.0.0)", # библа для работы PostgreSQL
    "python-dotenv (>=1.2.2,<2.0.0)",     # библа для работы скрытых строчек
    "pillow (>=12.2.0,<13.0.0)"
]

[tool.poetry]
packages = [{include = "sky_shop", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "flake8 (>=7.3.0,<8.0.0)",
    "mypy (>=1.20.2,<2.0.0)",
    "black (>=26.3.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "django-stubs (>=6.0.3,<7.0.0)"
]

[tool.mypy]
#ignore_errors = true  # Для учебного проекта можно вкл. пропуска ошибок.
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "sky_shop.settings"

[[tool.mypy.overrides]]
module = "django.*"
ignore_missing_imports = false

[tool.black]
line-length = 119
exclude = '''
(
  /(
      \.eggs         # Исключить несколько общих каталогов
    | \.git          # в корне проекта
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | dist
  )/
  | foo.py           # Также отдельно исключить файл с именем foo.py
                     # в корне проекта
)
'''

[tool.isort]
line_length = 119